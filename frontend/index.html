<!doctype html>
<html lang="en">
  <head>
    <script>
      // load the script first to ensure the theme is set before any styles are applied (this is important for avoiding flash of unstyled content)
      document.querySelector("html")?.setAttribute(
        "data-theme",
        localStorage.getItem("theme") || "system"
      );
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bithub_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BitHub</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
